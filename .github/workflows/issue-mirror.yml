name: Mirror Issue to Private Repo

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  mirror:
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing mirror
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            // Fast path: already tracked means mirror exists
            if (labels.includes('tracked')) {
              core.info(`Issue #${issue.number} already has 'tracked' label — skipping`);
              core.setOutput('exists', 'true');
              return;
            }

            // Safety net: search glint-src for an existing mirror of this issue
            const publicUrl = issue.html_url;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/glint-src is:issue label:public-issue "${publicUrl}" in:body`
            });

            if (data.total_count > 0) {
              core.info(`Found existing mirror(s) in glint-src: ${data.items.map(i => '#' + i.number).join(', ')} — skipping`);
              core.setOutput('exists', 'true');
              return;
            }

            core.setOutput('exists', 'false');

      - name: Create issue in private repo
        if: steps.check.outputs.exists == 'false'
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const publicUrl = issue.html_url;
            const owner = context.repo.owner;

            // Fetch comments from the public issue
            const comments = await github.rest.issues.listComments({
              owner,
              repo: 'glint',
              issue_number: issue.number,
            });

            let commentSection = '';
            if (comments.data.length > 0) {
              commentSection = '\n\n## Comments from public issue\n\n' +
                comments.data.map(c => {
                  const date = c.created_at.split('T')[0];
                  return `**@${c.user.login}** (${date}):\n${c.body}`;
                }).join('\n\n---\n\n');
            }

            const body = [
              `> **Mirrored from ${publicUrl}**`,
              `> This issue was copied from the public repo. The original may have`,
              `> additional comments and context not shown here — always check the`,
              `> link above before working on this issue.`,
              '',
              '---',
              '',
              issue.body || '_No description provided._',
              commentSection
            ].join('\n');

            const created = await github.rest.issues.create({
              owner,
              repo: 'glint-src',
              title: issue.title,
              body: body,
              labels: ['public-issue']
            });

            core.setOutput('private_url', created.data.html_url);

      - name: Comment on public issue
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This is now being tracked internally. We'll update this issue when it's resolved.`
            });

      - name: Update labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            // Replace accepted with tracked
            await github.rest.issues.removeLabel({
              owner, repo, issue_number,
              name: 'accepted'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['tracked']
            });

            // Remove triage if still present
            await github.rest.issues.removeLabel({
              owner, repo, issue_number,
              name: 'triage'
            }).catch(() => {});
